<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · 八方向角色</title><style>
*{box-sizing:border-box}body{margin:0;background:#101922;color:#e8eceb;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}p{color:#b3c3cc;line-height:1.7}button,select{background:#213442;border:1px solid #426072;color:#e8eceb;padding:9px 14px;border-radius:7px;margin:3px;cursor:pointer}button.on{background:#397e79;border-color:#7ed9bb}.panel{background:#182630;border:1px solid #304650;border-radius:12px;padding:16px;margin:20px 0}#game{width:100%;background:#344c42;outline:none;border-radius:8px}#gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.cell{text-align:center;background:#243640;padding:10px;border-radius:9px}.cell canvas{width:100%;image-rendering:pixelated}.label{color:#b3c3cc;font-size:12px}@media(max-width:650px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:14px}}
</style><main><h1>__TITLE__ · 八方向角色</h1><p>自由移动 · 3/4 俯视 · 高清 / 像素素材</p>
<section class="panel"><canvas id="game" width="1120" height="520" tabindex="0"></canvas><p>WASD / 方向键移动　Shift 奔跑　J 攻击　H 受击　X 倒地 / 复活。可同时按两个方向键斜向移动。</p><div id="status" class="label"></div></section>
<section class="panel"><div id="actions"></div><p class="label">同一动作的八个朝向 · 左向装备采用已烘焙镜像</p><div id="gallery"></div></section></main>
<script>
/*__PLAYER__*/
const DATA=/*__DATA__*/null;
const doc=DATA.doc;
const load=(src)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src;});
Promise.all(DATA.images.map(load)).then(images=>{
 const game=document.getElementById('game'),g=game.getContext('2d');
 const scale=doc.frame_size<=96?3:1;
 const demo=new TopDownController(doc,images,scale);demo.x=game.width/2;demo.y=game.height/2+40;
 const keys={},press={};let selected='idle';const cards=[];
 const names={idle:'待机',walk:'走路',run:'奔跑',attack:'攻击',hurt:'受击',death:'死亡'};
 for(const action of Object.keys(names)){
  if(!doc.clips[action+'_down'])continue;
  const b=document.createElement('button');b.textContent=names[action];b.dataset.action=action;
  b.onclick=()=>{selected=action;build();};document.getElementById('actions').append(b);
 }
 function build(){
  const box=document.getElementById('gallery');box.innerHTML='';cards.length=0;
  document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.action===selected));
  for(const dir of doc.direction_order){
   const cell=document.createElement('div');cell.className='cell';
   const cv=document.createElement('canvas');cv.width=cv.height=doc.frame_size;
   const label=document.createElement('div');label.className='label';label.textContent=selected+'_'+dir;
   cell.append(cv,label);box.append(cell);
   const p=new SpritePlayer(doc,images);p.play(selected+'_'+dir);cards.push({p,cv,hold:0});
  }
 }
 build();
 addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!e.repeat)press[e.code]=true;keys[e.code]=true;});
 addEventListener('keyup',e=>keys[e.code]=false);
 addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in press)press[k]=false;});
 let last=performance.now();
 function step(now){
  const dt=Math.min(50,now-last);last=now;
  const input={x:Number(!!(keys.KeyD||keys.ArrowRight))-Number(!!(keys.KeyA||keys.ArrowLeft)),y:Number(!!(keys.KeyS||keys.ArrowDown))-Number(!!(keys.KeyW||keys.ArrowUp)),run:keys.ShiftLeft||keys.ShiftRight,attack:press.KeyJ,hurt:press.KeyH,death:press.KeyX&&demo.action!=='death',revive:press.KeyX&&demo.action==='death'};
  const events=demo.update(dt,input);for(const k in press)press[k]=false;
  demo.x=Math.max(60,Math.min(game.width-60,demo.x));demo.y=Math.max(130,Math.min(game.height-30,demo.y));
  g.fillStyle='#344c42';g.fillRect(0,0,game.width,game.height);
  g.strokeStyle='#3e594d';g.lineWidth=1;
  for(let x=0;x<game.width;x+=48){g.beginPath();g.moveTo(x,0);g.lineTo(x,game.height);g.stroke();}
  for(let y=0;y<game.height;y+=48){g.beginPath();g.moveTo(0,y);g.lineTo(game.width,y);g.stroke();}
  g.fillStyle='#9aa078';for(const [x,y] of [[100,300],[940,150],[800,430],[370,220]]){g.beginPath();g.ellipse(x,y,28,14,0,0,Math.PI*2);g.fill();}
  g.imageSmoothingEnabled=doc.frame_size>96;demo.player.draw(g,demo.x,demo.y,{scale});
  document.getElementById('status').textContent=demo.action+' · '+demo.direction+' · '+Math.round(demo.x)+', '+Math.round(demo.y)+(events.length?' · '+events.join(', '):'');
  for(const card of cards){
   if(card.p.done){card.hold+=dt;if(card.hold>600){card.p.play(card.p.name,{restart:true});card.hold=0;}}
   card.p.update(dt);const ctx=card.cv.getContext('2d');ctx.clearRect(0,0,card.cv.width,card.cv.height);card.p.draw(ctx,doc.pivot[0],doc.pivot[1]);
  }
  requestAnimationFrame(step);
 }
 window.__demo={controller:demo,doc,images};requestAnimationFrame(step);
}).catch(e=>{document.getElementById('status').textContent='加载失败：'+e.message;throw e;});
</script></html>
